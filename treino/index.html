<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Nossos Treinos</title>
<script>
// Aplica o tema antes de desenhar a página, para não piscar.
try{var th=JSON.parse(localStorage.getItem("treino.v2")||"{}").theme;if(th==="light"||th==="dark")document.documentElement.dataset.theme=th}catch(e){}
</script>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--text:#15171c;--muted:#5f6672;--line:#e1e4e9;--chip:#eceef2;
  --accent:#d9480f;--accent-soft:#fff0e6;--on-accent:#ffffff;--ok:#2b8a3e;--ok-soft:#e6f4ea;--img:#ffffff;
  --shadow:0 6px 24px rgba(0,0,0,.14);--overlay:rgba(10,12,16,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115;--card:#181b21;--text:#eceef2;--muted:#9aa1ad;--line:#2a2e36;--chip:#232730;
    --accent:#ff7a2e;--accent-soft:#2b1d14;--on-accent:#1a0d05;--ok:#51cf66;--ok-soft:#16261a;--img:#e9eaec;
    --shadow:0 6px 24px rgba(0,0,0,.5);--overlay:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115;--card:#181b21;--text:#eceef2;--muted:#9aa1ad;--line:#2a2e36;--chip:#232730;
  --accent:#ff7a2e;--accent-soft:#2b1d14;--on-accent:#1a0d05;--ok:#51cf66;--ok-soft:#16261a;--img:#e9eaec;
  --shadow:0 6px 24px rgba(0,0,0,.5);--overlay:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 0;border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hdr h1{font-size:20px;margin:0;flex:1;letter-spacing:-.01em}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.iconbtn .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.who{display:flex;gap:4px;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:6px}
.who button{flex:1;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:700;padding:7px;cursor:pointer}
.who button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs{display:flex;gap:6px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);font-weight:600;padding:9px 4px 11px;border-bottom:3px solid transparent;cursor:pointer;position:relative}
.tab small{display:block;font-weight:400;font-size:11px}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.tab .next{position:absolute;top:2px;right:4px;font-size:9px;font-weight:800;color:var(--on-accent);background:var(--accent);border-radius:6px;padding:1px 5px;letter-spacing:.02em}

main{padding:14px 16px calc(110px + env(safe-area-inset-bottom))}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:0 0 12px;padding:11px 14px;border-radius:12px;background:var(--accent-soft);font-size:14px}
.banner button{border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:700;padding:8px 12px;cursor:pointer;white-space:nowrap}
.banner .x{background:transparent;color:var(--muted);padding:8px}
.progress{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:var(--muted);font-size:14px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.list{display:grid;gap:14px}
@media(min-width:700px){.list{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card.done{border-color:var(--ok)}
.media{position:relative;background:var(--img);aspect-ratio:3/2;cursor:pointer}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .25s}
.media img.b{opacity:0}
.media.f1 img.b{opacity:1}
.media iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.media .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#666;font-weight:600;padding:20px;text-align:center}
.badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.66);color:#fff;font-weight:700;font-size:13px;border-radius:8px;padding:2px 8px}
.paused-l{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;border-radius:8px;padding:2px 8px;display:none}
.media.paused .paused-l{display:block}
.body{padding:12px 14px 14px}
.title{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.title h2{font-size:17px;margin:0}
.scheme{font-weight:700;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.grp{font-size:12px;color:var(--muted);margin-top:1px}
.tag{display:inline-block;margin:8px 0 0;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px}
.tip{color:var(--muted);font-size:14px;margin:8px 0 10px}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.set{min-width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-weight:600;cursor:pointer}
.set.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.set.wide{padding:0 16px}
.actions{display:flex;gap:8px}
.btn{flex:1;display:inline-flex;justify-content:center;align-items:center;gap:6px;min-height:42px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;color:var(--text)}
.btn .ico{width:17px;height:17px}
.btn.primary{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.solid{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn.danger{color:#e03131}
.note{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px dashed var(--line);color:var(--muted);font-size:14px}
.editbar{display:flex;gap:8px;margin-bottom:12px}
.edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.edit label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.edit label.full{grid-column:1/-1}
.edit input{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 10px;min-width:0;width:100%}
.order{display:flex;gap:6px}
.order .btn{flex:none;width:44px}

.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:9;display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 16px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.timer .t{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:58px}
.timer .t.run{color:var(--accent)}
.pill{border:0;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;padding:8px 12px;cursor:pointer}

/* Painel deslizante (folha) */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:20;display:none}
.overlay.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;max-width:760px;margin:0 auto;box-shadow:var(--shadow)}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:4px 0 12px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.sheet h4{margin:18px 0 8px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.close{border:0;background:var(--chip);border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer}
.opt img{width:72px;height:48px;object-fit:contain;background:var(--img);border-radius:8px;flex:none}
.opt b{display:block;font-size:15px}
.opt small{color:var(--muted);font-size:12px}
.opt.cur{border-color:var(--accent)}
.seg{display:flex;gap:4px;background:var(--chip);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:700;padding:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.row{display:flex;gap:8px;margin-top:8px}
.muted{color:var(--muted);font-size:14px}
.field{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;width:100%}
.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

/* Histórico */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 8px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:11px;color:var(--muted);padding:2px 0}
.day{aspect-ratio:1;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.day.empty{background:transparent;border:0}
.day.today{border-color:var(--text)}
.day.has{background:var(--ok-soft);border-color:var(--ok);color:var(--text)}
.day.has i{font-style:normal;font-weight:800;font-size:13px;color:var(--ok);line-height:1.1}
.log{display:grid;gap:6px;margin-top:8px}
.log div{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-150%);z-index:30;background:var(--text);color:var(--bg);border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;transition:transform .25s;max-width:calc(100% - 32px)}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hdr">
      <h1 id="h1">Treino</h1>
      <button class="iconbtn" id="openHist" aria-label="Histórico"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></button>
      <button class="iconbtn" id="openMenu" aria-label="Ajustes"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="dot" id="syncDot" hidden></span></button>
    </div>
    <div class="who" id="who"></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main class="wrap">
  <div id="banners"></div>
  <div class="progress"><span id="ptext"></span><div class="bar"><i id="pbar"></i></div></div>
  <div class="editbar" id="editbar"></div>
  <div class="list" id="list"></div>
  <div id="after"></div>
</main>
<div class="timer" aria-label="Cronômetro de descanso">
  <span class="t" id="tt">0:00</span>
  <button class="pill" data-rest="60">60s</button>
  <button class="pill" data-rest="90">90s</button>
  <button class="pill" data-rest="120">2min</button>
</div>
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
